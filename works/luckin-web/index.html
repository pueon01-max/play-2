<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luckin Coffee</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 1. HERO -->
  <section class="hero" id="heroSection">
    <img src="imgs/img22.webp" alt="Hero background" class="hero-bg" />

    <img src="imgs/img25.webp" alt="Floating coffee" class="hero-coffee" />

    <div class="main-nav-wrap">
    <a href="index.html" class="main-logo-icon">
      <img src="imgs/img21.webp" alt="Luckin logo icon" />
    </a>

    <a href="index.html" class="main-logo-word">
      <img src="imgs/img24.webp" alt="Luckin coffee logo" />
    </a>

    <nav class="main-nav">
      <a href="index.html" class="is-active">HOME</a>
      <a href="about.html">About us</a>
      <a href="investor.html">Investor</a>
      <a href="#">Partner Login</a>
    </nav>
  </div>

  <button class="download-btn">Download App</button>
  <div class="hero-line"></div>

    <button class="download-btn">Download App</button>
    <div class="hero-line"></div>
  </section>


<!-- 2. INTRO -->
<section class="section intro-section" id="introSection">
  <div class="intro-inner" id="introInner">
    <img src="imgs/img05.webp" alt="Intro section" class="full-img" />

    <div class="intro-clover-wrap" id="introCloverWrap">
      <img src="imgs/img19.webp" alt="clover" class="intro-clover" />
    </div>
  </div>
</section>


  <!-- 3. FEATURE -->
  <section class="feature-section" id="featureSection">
    <img src="imgs/img07.webp" alt="Feature background" class="feature-bg" />

    <div class="feature-overlay">
      <div class="feature-cards">
        <img src="imgs/img08.webp" alt="Feature card 1" class="feature-card reveal-card" />
        <img src="imgs/img06.webp" alt="Feature card 2" class="feature-card reveal-card" />
        <img src="imgs/img09.webp" alt="Feature card 3" class="feature-card reveal-card" />
      </div>
    </div>
  </section>

  <!-- 4. APP RIPPLE -->
<section class="app-section" id="appSection">
  <!-- ripple 적용될 배경 레이어 -->
  <div class="app-ripple-bg" id="appRippleBg"></div>

  <!-- 흔들리지 않을 고정 콘텐츠 -->
  <div class="app-content">
    <h2 class="app-title">Find Nearby<br>Luckin Coffee</h2>
    <p class="app-subtitle">And order with ease.</p>

  </div>
</section>

  <!-- 5. EASY FAST -->
  <section class="easy-section">
    <img src="imgs/img11.webp" alt="Easy fast background" class="full-img" />

    <div class="easy-overlay">
      <h2 class="easy-text easy-left">WE ARE EASY</h2>
      <img src="imgs/img12.webp" alt="Center coffee" class="easy-cup" />
      <h2 class="easy-text easy-right">and FAST!</h2>
    </div>
  </section>

  <!-- 6. BEST SELLERS -->
  <section class="best-section">
    <img src="imgs/img14.webp" alt="Best seller background" class="full-img best-bg" />

    <div class="best-overlay">
      <h2 class="best-title">Our Best Sellers</h2>

      <div class="best-grid">
        <div class="best-item">
          <img src="imgs/img15.webp" alt="Iced Americano" class="best-item-img" />
          <p class="best-item-name">Iced Americano</p>
        </div>

        <div class="best-item">
          <img src="imgs/img13.webp" alt="Milk Latte" class="best-item-img" />
          <p class="best-item-name">Milk Latte</p>
        </div>

        <div class="best-item">
          <img src="imgs/img16.webp" alt="Velvet Latte" class="best-item-img" />
          <p class="best-item-name">Velvet Latte</p>
        </div>
      </div>

      <button class="menu-btn">View All Menu →</button>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">luckin coffee</div>
      <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Menu</a>
        <a href="#">Stores</a>
        <a href="#">Investor</a>
      </div>
      <p class="footer-copy">© 2026 Luckin Coffee. All rights reserved.</p>
    </div>
  </footer>

<script src="https://code.jquery.com/jquery-3.4.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>
<script src="script.js"></script>
</body>
</html>
